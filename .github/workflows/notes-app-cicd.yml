
name: Notes App Azure CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "**"
      - "!.github/README.md"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: notes-app-terraform
  cancel-in-progress: false

env:
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  ACR_NAME: notesappacr1ead709e
  IMAGE_NAME: notes-app
  TF_WORKING_DIR: "."

jobs:
  validate:
    name: Terraform Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Debug Terraform formatting
        run: |
          echo "Commit: $GITHUB_SHA"
          terraform version
          pwd
          git status --short
          terraform fmt -check -recursive -diff

      - name: Format check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Initialize Terraform without backend
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend=false

      - name: Validate Terraform
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

  plan:
    name: Terraform Plan
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Initialize remote state
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -input=false \
            -var="image_tag=v1" \
            -no-color

  deploy:
    name: Build Push and Deploy
    needs: plan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Initialize Terraform remote state
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Generate Docker image tag
        id: image
        shell: bash
        run: |
          TAG="${GITHUB_SHA::12}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Login to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Build Docker image
        run: |
          docker build \
            -t "$ACR_NAME.azurecr.io/$IMAGE_NAME:${{ steps.image.outputs.tag }}" \
            .

      - name: Push image to ACR
        run: |
          docker push \
            "$ACR_NAME.azurecr.io/$IMAGE_NAME:${{ steps.image.outputs.tag }}"

      - name: Terraform plan for deployment
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -input=false \
            -var="image_tag=${{ steps.image.outputs.tag }}" \
            -out=tfplan

      - name: Deploy Azure infrastructure
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Verify container group
        run: |
          az container show \
            --resource-group notes-app-rg \
            --name notes-app-container-group \
            --query "containers[].{Name:name,State:instanceView.currentState.state}" \
            -o table

      - name: Show deployment outputs
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform output
